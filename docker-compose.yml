services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: poliscope
      POSTGRES_USER: poliscope
      POSTGRES_PASSWORD: poliscope_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poliscope -d poliscope"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3000:3000"
      - "24678:24678"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NUXT_DATABASE_URL: postgresql://poliscope:poliscope_dev@db:5432/poliscope
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
